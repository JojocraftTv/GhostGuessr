name: Build Production (Patcher)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}\src\patcher\src-tauri\target

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src/patcher/src-tauri
          cache-on-failure: true

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Install patcher dependencies
        working-directory: src/patcher
        run: pnpm install

      - name: Update Cargo.toml version
        shell: pwsh
        run: |
          $refName = "${{ inputs.tag_name || github.ref_name }}"
          $version = $refName.TrimStart("v")
          $cargoPath = Join-Path $env:GITHUB_WORKSPACE "src/patcher/src-tauri/Cargo.toml"
          (Get-Content $cargoPath -Raw) `
            -replace '(?m)^version\s*=\s*".*"$', "version = `"$version`"" `
            | Set-Content $cargoPath
          "Updated Cargo.toml version to $version"

      - name: Build Tauri app
        working-directory: src/patcher
        run: pnpm build

      - name: Generate update.json
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag_name || github.ref_name }}"

          $releaseDir = Join-Path $env:CARGO_TARGET_DIR "release"
          if (!(Test-Path $releaseDir)) { throw "Release dir not found: $releaseDir" }

          $exePath = Join-Path $releaseDir "GhostGuessr-Patcher.exe"

          if (!(Test-Path $exePath)) {
            $cand = Get-ChildItem $releaseDir -Filter "*.exe" | Sort-Object Length -Descending | Select-Object -First 1
            if (!$cand) { throw "No .exe found in $releaseDir" }
            $exePath = $cand.FullName
          }

          "Using exe: $exePath"

          $hash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLower()
          $digest = "sha256:$hash"

          $fileName = [System.IO.Path]::GetFileName($exePath)
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$fileName"

          (@{ version=$tag; url=$url; digest=$digest } | ConvertTo-Json) |
            Set-Content (Join-Path $env:GITHUB_WORKSPACE "update.json") -Encoding utf8

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: |
            src/patcher/src-tauri/target/release/*.exe
            update.json
