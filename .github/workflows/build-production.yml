name: Build Production (publish to dist/production)

on:
  workflow_dispatch:
    inputs:
      version:
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - run: pnpm install

      - if: ${{ inputs.version != '' }}
        shell: bash
        run: |
          set -e
          npm version "${{ inputs.version }}" --allow-same-version --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump version to ${{ inputs.version }}"
          git push origin HEAD:${{ github.ref_name }}

      - run: pnpm build

      - shell: bash
        run: |
          set -euo pipefail

          OUT=".publish/production"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          cp -f dist/ghostguessr-core.user.js "$OUT/ghostguessr-core.user.js"

          if [ -f "dist/ghostguessr-core.proxy.user.js" ]; then
            cp -f dist/ghostguessr-core.proxy.user.js "$OUT/GhostGuessr.user.js"
          fi

          VERSION=$(node -p "require('./package.json').version")

          if [ -f "$OUT/GhostGuessr.user.js" ]; then
            sed -i 's|http://localhost:8080/ghostguessr-core.user.js|https://github.com/JojocraftTv/GhostGuessr/raw/refs/heads/dist/production/ghostguessr-core.user.js|g' "$OUT/GhostGuessr.user.js"
            sed -i "s|\[version\]|$VERSION|g" "$OUT/GhostGuessr.user.js"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin dist || true
          git reset --hard
          git clean -fdx

          if git show-ref --verify --quiet refs/remotes/origin/dist; then
            git checkout -B dist origin/dist
          else
            git checkout --orphan dist
            git rm -rf . || true
            git commit --allow-empty -m "init dist branch"
          fi

          rm -rf production dev GhostGuessr*.user.js || true
          mkdir -p production
          cp -f "$OUT/"* production/

          git add -A
          git diff --cached --quiet && exit 0

          git commit -m "chore: publish production v$VERSION"
          git push -f origin dist
