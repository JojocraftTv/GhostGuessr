name: Build Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 2.3.1)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update version if provided
        if: ${{ inputs.version }}
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ inputs.version }}"

      - name: Build production version
        run: pnpm build

      - name: Commit production build
        run: |
          if ! git status --porcelain | grep -q .; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/ghostguessr-core.user.js GhostGuessr.user.js
          if git diff --cached --quiet; then
            echo "No dist changes"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore: build production v$VERSION"
          git push origin HEAD:${{ github.ref }}

      - name: Create tag if version provided
        if: ${{ inputs.version }}
        run: |
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
