name: Build Dev (publish to dist/dev)

on:
  push:
    branches: [main]
    paths:
      - "src/userscript/**"
      - "webpack.config.js"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: write

concurrency:
  group: build-dev-main
  cancel-in-progress: true

jobs:
  build-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - run: pnpm install
      - run: pnpm build

      - shell: bash
        run: |
          set -euo pipefail

          OUT=".publish/dev"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          cp -f dist/ghostguessr-core.user.js "$OUT/ghostguessr-core.user.js"

          if [ -f "dist/ghostguessr-core.proxy.user.js" ]; then
            cp -f dist/ghostguessr-core.proxy.user.js "$OUT/ghostguessr-core.proxy.user.js"
            cp -f dist/ghostguessr-core.proxy.user.js "$OUT/GhostGuessr.dev.user.js"
          fi

          if [ -f "$OUT/GhostGuessr.dev.user.js" ]; then
            sed -i 's|http://localhost:8080/ghostguessr-core.user.js|https://github.com/JojocraftTv/GhostGuessr/raw/refs/heads/dist/dev/ghostguessr-core.user.js|g' "$OUT/GhostGuessr.dev.user.js"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin dist || true
          git reset --hard
          git clean -fdx

          if git show-ref --verify --quiet refs/remotes/origin/dist; then
            git checkout -B dist origin/dist
          else
            git checkout --orphan dist
            git rm -rf . || true
            git commit --allow-empty -m "init dist branch"
          fi

          rm -rf dev production GhostGuessr*.user.js || true
          mkdir -p dev
          cp -f "$OUT/"* dev/

          git add -A
          git diff --cached --quiet && exit 0

          VERSION=$(node -p "require('./package.json').version" || echo dev)
          git commit -m "chore: publish dev build v$VERSION [skip ci]"
          git push -f origin dist
