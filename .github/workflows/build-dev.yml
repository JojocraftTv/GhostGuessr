name: Build Dev (to dist/dev)

on:
  push:
    branches: [main]
    paths:
      - "src/userscript/**"
      - "webpack.config.js"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: write

concurrency:
  group: build-dev-main
  cancel-in-progress: true

jobs:
  build-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Copy build output to dist/dev
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/dev
          rm -f dist/dev/*.user.js dist/dev/*.map || true

          # Core build -> dist/dev
          cp -f dist/ghostguessr-core.user.js dist/dev/ghostguessr-core.user.js

          # Proxy build (if present) -> dist/dev AND root convenience file
          if [ -f "dist/ghostguessr-core.proxy.user.js" ]; then
            cp -f dist/ghostguessr-core.proxy.user.js dist/dev/ghostguessr-core.proxy.user.js
            cp -f dist/ghostguessr-core.proxy.user.js GhostGuessr.dev.user.js
          else
            echo "No proxy userscript found: dist/ghostguessr-core.proxy.user.js"
          fi

      - name: Replace localhost URL in dev proxy (if present)
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "GhostGuessr.dev.user.js" ]; then
            sed -i 's|http://localhost:8080/ghostguessr-core.user.js|https://github.com/JojocraftTv/GhostGuessr/raw/refs/heads/main/dist/dev/ghostguessr-core.user.js|g' GhostGuessr.dev.user.js
          else
            echo "GhostGuessr.dev.user.js not found, skipping sed"
          fi

      - name: Commit dist/dev
        shell: bash
        run: |
          set -euo pipefail

          if ! git status --porcelain | grep -q .; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f dist/dev/ghostguessr-core.user.js

          if [ -f "dist/dev/ghostguessr-core.proxy.user.js" ]; then
            git add -f dist/dev/ghostguessr-core.proxy.user.js
          fi
          if [ -f "GhostGuessr.dev.user.js" ]; then
            git add -f GhostGuessr.dev.user.js
          fi

          if git diff --cached --quiet; then
            echo "No dev dist changes"
            exit 0
          fi

          VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore: update dev build (dist/dev) v$VERSION [skip ci]"
          git push origin HEAD:main
