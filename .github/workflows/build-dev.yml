name: Build Dev (to dist/dev)

on:
  push:
    branches: [main]
    paths:
      - "src/userscript/**"
      - "webpack.config.js"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: write

concurrency:
  group: build-dev-main
  cancel-in-progress: true

jobs:
  build-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Copy build output to dist/dev
        run: |
          set -e
          mkdir -p dist/dev

          rm -f dist/dev/*.user.js dist/dev/*.map 2>/dev/null || true

          cp -f dist/ghostguessr-core.user.js dist/dev/ghostguessr-core.user.js
          cp -f GhostGuessr.user.js dist/dev/GhostGuessr.user.js

      - name: Commit dist/dev
        run: |
          set -e

          if ! git status --porcelain | grep -q .; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f dist/dev/ghostguessr-core.user.js dist/dev/GhostGuessr.user.js

          if git diff --cached --quiet; then
            echo "No dev dist changes"
            exit 0
          fi

          VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore: update dev build (dist/dev) v$VERSION [skip ci]"
          git push origin HEAD:main
