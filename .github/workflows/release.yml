name: Build and Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}\patcher\src-tauri\target

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            patcher/src-tauri
          cache-on-failure: true

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI (fast)
        shell: pwsh
        run: cargo binstall tauri-cli -y

      - name: Update Cargo.toml version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $cargoPath = Join-Path $env:GITHUB_WORKSPACE "patcher/src-tauri/Cargo.toml"
          (Get-Content $cargoPath -Raw) `
            -replace '(?m)^version\s*=\s*".*"$', "version = `"$version`"" `
            | Set-Content $cargoPath
          "Updated Cargo.toml version to $version"

      - name: Build Tauri app
        shell: pwsh
        run: |
          cd (Join-Path $env:GITHUB_WORKSPACE "patcher/src-tauri")
          cargo tauri build

      - name: Generate update.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"

          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "patcher/src-tauri/target/release"

          $exePath = Join-Path $releaseDir "GhostGuessr-Patcher.exe"

          if (!(Test-Path $exePath)) {
            $cand = Get-ChildItem $releaseDir -Filter "*.exe" | Sort-Object Length -Descending | Select-Object -First 1
            if (!$cand) { throw "No .exe found in $releaseDir" }
            $exePath = $cand.FullName
          }

          "Using exe: $exePath"

          $hash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLower()
          $digest = "sha256:$hash"

          $fileName = [System.IO.Path]::GetFileName($exePath)
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$fileName"

          (@{ version=$tag; url=$url; digest=$digest } | ConvertTo-Json) |
            Set-Content (Join-Path $env:GITHUB_WORKSPACE "update.json") -Encoding utf8

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            patcher/src-tauri/target/release/*.exe
            update.json
