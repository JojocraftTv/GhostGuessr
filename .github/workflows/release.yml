name: Build and Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: patcher/src-tauri/target

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: patcher/src-tauri
          cache-on-failure: true

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI (fast)
        shell: pwsh
        run: cargo binstall tauri-cli -y

      - name: Update Cargo.toml version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $cargoPath = "patcher/src-tauri/Cargo.toml"
          (Get-Content $cargoPath -Raw) `
            -replace '(?m)^version\s*=\s*".*"$', "version = `"$version`"" `
            | Set-Content $cargoPath
          "Updated Cargo.toml version to $version"

      - name: Build Tauri app
        shell: pwsh
        run: |
          cd patcher/src-tauri
          cargo tauri build

      - name: Generate update.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exePath = "patcher/src-tauri/target/release/GhostGuessr-Patcher.exe"
          $hash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLower()
          $digest = "sha256:$hash"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/GhostGuessr-Patcher.exe"

          (@{ version=$tag; url=$url; digest=$digest } | ConvertTo-Json) |
            Set-Content "update.json" -Encoding utf8

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            patcher/src-tauri/target/release/GhostGuessr-Patcher.exe
            update.json
