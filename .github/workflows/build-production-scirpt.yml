name: Build Production (Script)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 2.3.1)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Update version if provided
        if: ${{ inputs.version != '' }}
        run: |
          set -e

          npm version "${{ inputs.version }}" --allow-same-version --no-git-tag-version

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json pnpm-lock.yaml

          if git diff --cached --quiet; then
            echo "No version-related changes to commit."
            exit 0
          fi

          git commit -m "chore: bump version to ${{ inputs.version }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Build production version
        run: pnpm build

      - name: Copy proxy script to GhostGuessr.user.js (if exists)
        run: |
          cp -f dist/ghostguessr-core.proxy.user.js GhostGuessr.user.js 2>/dev/null || true

      - name: Replace localhost URL and version in GhostGuessr.user.js
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i 's|http://localhost:8080/ghostguessr-core.user.js|https://github.com/JojocraftTv/GhostGuessr/raw/refs/heads/main/dist/ghostguessr-core.user.js|g' GhostGuessr.user.js
          sed -i "s|\[version\]|$VERSION|g" GhostGuessr.user.js
          sed -i 's|// @run-at document-start|// @run-at document-start\n// @updateURL   https://raw.githubusercontent.com/JojocraftTv/GhostGuessr/main/dist/GhostGuessr.user.js\n// @downloadURL https://raw.githubusercontent.com/JojocraftTv/GhostGuessr/main/dist/GhostGuessr.user.js|g' GhostGuessr.user.js
      - name: Inject Hash into production script
        run: |
          FILE="dist/ghostguessr-core.user.js"
          HASH=$(sha256sum "$FILE" | awk '{print $1}')
          INJECT="try { localStorage.setItem('gg_current_script_hash', '$HASH'); } catch(e) {}"
          
          awk -v inject="$INJECT" '
            { print } 
            /\/\/ ==\/UserScript==/ { print inject }
          ' "$FILE" > "${FILE}.tmp" && mv "${FILE}.tmp" "$FILE"
          
          echo "Injected hash: $HASH"

      - name: Commit production build
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f dist/ghostguessr-core.user.js
          git add -f GhostGuessr.user.js 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No dist changes"
            exit 0
          fi

          VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore: build production v$VERSION"
          git push origin HEAD:${{ github.ref_name }}