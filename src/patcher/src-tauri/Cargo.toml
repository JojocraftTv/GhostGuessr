[package]
name = "GhostGuessr-Patcher"
version = "3.0.0"
edition = "2021"

[package.metadata]

[package.metadata.tauri]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rfd = "0.14"
open = "5"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.11"

[dev-dependencies]
tempfile = "3.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
